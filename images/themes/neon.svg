  </radialGradient>
  <radialGradient id="glow-neon" cx=".5" cy=".42" r=".6">
    <stop offset="0" stop-color="#7ef5ff" stop-opacity=".55"/><stop offset="1" stop-color="#7ef5ff" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="face-neon">
    <path d="M124 196c0-62 30-98 76-98s76 36 76 98c0 50-32 100-76 118-44-18-76-68-76-118Z"/>
  </clipPath>
</defs>

<ellipse cx="200" cy="300" rx="200" ry="260" fill="url(#glow-neon)"/>

