<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="400" height="620" role="img" aria-label="Rin, the neon theme portrait">
<defs>
  <linearGradient id="hair-neon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7ef5ff"/><stop offset=".55" stop-color="#28c8ff"/><stop offset="1" stop-color="#1b6ad1"/>
  </linearGradient>
  <linearGradient id="hairF-neon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7ef5ff"/><stop offset="1" stop-color="#28c8ff"/>
