<!doctype html>
<html lang="en" data-theme="sakura" data-morph="glass" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="color-scheme" content="dark light">
<title>AURA — Music Player</title>
<meta name="description" content="AURA · a private, offline-first music player with live visualizers, spatial audio and anime themes.">
<meta name="theme-color" content="#0b0714">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/favi.png">
<link rel="apple-touch-icon" href="images/favi.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/outfit-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/core.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/chars.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/backdrop.css">
<link rel="stylesheet" href="css/polish.css">
<link rel="stylesheet" href="css/anim.css">
<link rel="stylesheet" href="css/design.css">
</head>
<body>

<!-- ══════════ ambient background stack ══════════ -->
<div id="bg" aria-hidden="true">
  <div class="bg-base"></div>
  <div class="bg-aurora"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>
  <div class="bg-char" id="bgChar"><i class="bg-char-lq" id="bgCharLq"></i><i class="bg-char-hi" id="bgCharHi"></i></div>
  <div class="bg-art" id="bgArt"></div>
  <canvas class="bg-viz" id="bgViz"></canvas>
  <div class="bg-grain"></div>
  <div class="bg-vignette"></div>
</div>

<!-- ══════════ boot splash ══════════ -->
<div id="boot">
  <div class="boot-mark"><span class="ring"></span><span class="ring r2"></span><b>A</b></div>
  <p class="boot-name">AURA</p>
  <p class="boot-sub" id="bootSub">waking the speakers…</p>
</div>

<!-- ══════════ app shell ══════════ -->
<div id="app" hidden>

  <!-- left rail (desktop) -->
  <aside id="rail">
    <div class="rail-brand" title="AURA">
      <span class="brand-glyph"><svg class="ico"><use href="#i-aura"/></svg></span>
      <span class="brand-text">AURA</span>
    </div>
    <nav class="rail-nav" aria-label="Primary">
      <button class="rail-btn is-on" data-view="home"><svg class="ico"><use href="#i-home"/></svg><span>Home</span></button>
      <button class="rail-btn" data-view="library"><svg class="ico"><use href="#i-library"/></svg><span>Library</span></button>
      <button class="rail-btn" data-view="queue"><svg class="ico"><use href="#i-queue"/></svg><span>Queue</span><i class="rail-badge" id="queueBadge">0</i></button>
      <button class="rail-btn" data-view="playlists"><svg class="ico"><use href="#i-playlist"/></svg><span>Playlists</span></button>
      <button class="rail-btn" data-view="stats"><svg class="ico"><use href="#i-dna"/></svg><span>DNA</span></button>
      <button class="rail-btn" data-view="lab"><svg class="ico"><use href="#i-lab"/></svg><span>Lab</span></button>
      <button class="rail-btn" data-view="settings"><svg class="ico"><use href="#i-settings"/></svg><span>Settings</span></button>
    </nav>
    <div class="rail-foot">
      <button class="rail-btn ghost" id="railTheme"><svg class="ico"><use href="#i-palette"/></svg><span>Theme</span></button>
      <div class="presence-pill" id="presencePill" title="People listening right now">
        <span class="pulse-dot"></span>
        <b id="presenceCount">—</b><span class="presence-label">listening</span>
      </div>
    </div>
  </aside>

  <!-- main column -->
  <main id="main">
    <header id="topbar">
      <button class="icon-btn only-mobile" id="mobileMenu" aria-label="Menu"><svg class="ico"><use href="#i-menu"/></svg></button>
      <div class="search-wrap">
        <svg class="ico search-ico"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Search tracks, artists, albums…" autocomplete="off" spellcheck="false" aria-label="Search library">
        <kbd class="search-kbd">/</kbd>
        <button class="icon-btn tiny search-clear" id="searchClear" hidden aria-label="Clear search"><svg class="ico"><use href="#i-close"/></svg></button>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnImport" title="Add local files (⌘/Ctrl+O)"><svg class="ico"><use href="#i-plus"/></svg></button>
        <button class="icon-btn" id="btnMoodDj" title="Mood DJ — build an energy arc"><svg class="ico"><use href="#i-wand"/></svg></button>
        <button class="icon-btn" id="btnHelp" title="Keyboard shortcuts (?)"><svg class="ico"><use href="#i-keyboard"/></svg></button>
        <button class="icon-btn only-mobile" id="mobilePresence" title="Listeners"><span class="pulse-dot"></span><b id="presenceCountM">—</b></button>
      </div>
    </header>

    <div id="views">
      <section class="view is-on" data-view="home"></section>
      <section class="view" data-view="library"></section>
      <section class="view" data-view="queue"></section>
      <section class="view" data-view="playlists"></section>
      <section class="view" data-view="stats"></section>
      <section class="view" data-view="lab"></section>
      <section class="view" data-view="settings"></section>
    </div>
  </main>
</div>

<!-- ══════════ mobile nav ══════════ -->
<nav id="mobileNav" hidden aria-label="Primary mobile">
  <button class="mnav-btn is-on" data-view="home"><svg class="ico"><use href="#i-home"/></svg><span>Home</span></button>
  <button class="mnav-btn" data-view="library"><svg class="ico"><use href="#i-library"/></svg><span>Library</span></button>
  <button class="mnav-btn" data-view="queue"><svg class="ico"><use href="#i-queue"/></svg><span>Queue</span></button>
  <button class="mnav-btn" data-view="stats"><svg class="ico"><use href="#i-dna"/></svg><span>DNA</span></button>
  <button class="mnav-btn" data-view="settings"><svg class="ico"><use href="#i-settings"/></svg><span>More</span></button>
</nav>

<!-- ══════════ mini player bar ══════════ -->
<div id="playerBar" hidden>
  <div class="pb-seek" id="pbSeek"><i class="pb-buffered" id="pbBuffered"></i><i class="pb-played" id="pbPlayed"></i><i class="pb-head" id="pbHead"></i></div>
  <div class="pb-inner">
    <button class="pb-meta" id="pbMeta" title="Open now playing">
      <span class="pb-art"><img id="pbArt" alt="" decoding="async"><i class="pb-art-glow"></i></span>
      <span class="pb-text">
        <b id="pbTitle">Nothing playing</b>
        <small id="pbArtist">pick a track to begin</small>
      </span>
    </button>
    <div class="pb-controls">
      <button class="icon-btn" id="btnShuffle" title="Shuffle (S)"><svg class="ico"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn" id="btnPrev" title="Previous (K)"><svg class="ico"><use href="#i-prev"/></svg></button>
      <button class="play-btn" id="btnPlay" title="Play / Pause (Space)"><svg class="ico ico-play"><use href="#i-play"/></svg><svg class="ico ico-pause"><use href="#i-pause"/></svg><i class="play-ring"></i></button>
      <button class="icon-btn" id="btnNext" title="Next (L)"><svg class="ico"><use href="#i-next"/></svg></button>
      <button class="icon-btn" id="btnRepeat" title="Repeat (R)"><svg class="ico"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="pb-right">
      <span class="pb-time"><b id="pbCur">0:00</b><i>/</i><span id="pbDur">0:00</span></span>
      <button class="icon-btn" id="btnLike" title="Favourite (F)"><svg class="ico"><use href="#i-heart"/></svg></button>
      <button class="icon-btn" id="btnMark" title="Drop a Moment Mark (M)"><svg class="ico"><use href="#i-mark"/></svg></button>
      <div class="vol-wrap">
        <button class="icon-btn" id="btnMute" title="Mute (Shift+M)"><svg class="ico"><use href="#i-vol"/></svg></button>
        <input id="vol" class="range vol-range" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>
      <button class="icon-btn" id="btnExpand" title="Full screen (E)"><svg class="ico"><use href="#i-expand"/></svg></button>
    </div>
  </div>
</div>

<!-- ══════════ immersive now-playing ══════════ -->
<div id="nowPlaying" hidden aria-hidden="true">
  <canvas id="npViz"></canvas>
  <div class="np-scrim"></div>
  <div class="np-top">
    <button class="icon-btn" id="npClose" aria-label="Close"><svg class="ico"><use href="#i-chevdown"/></svg></button>
    <div class="np-tabs">
      <button class="np-tab is-on" data-pane="art">Art</button>
      <button class="np-tab" data-pane="lyrics">Lyrics</button>
      <button class="np-tab" data-pane="up">Up next</button>
    </div>
    <button class="icon-btn" id="npVizMode" title="Cycle visualizer (V)"><svg class="ico"><use href="#i-viz"/></svg></button>
  </div>

  <div class="np-body">
    <div class="np-pane is-on" data-pane="art">
      <div class="np-cover" id="npCover">
        <img id="npArt" alt="" decoding="async">
        <canvas id="npRing"></canvas>
        <div class="np-orbit" id="npOrbit"><i></i></div>
      </div>
    </div>
    <div class="np-pane" data-pane="lyrics"><div class="lyrics" id="lyrics"></div></div>
    <div class="np-pane" data-pane="up"><div class="np-queue" id="npQueue"></div></div>
  </div>

  <div class="np-foot">
    <div class="np-titles">
      <h2 id="npTitle">—</h2>
      <p id="npArtist">—</p>
    </div>
    <div class="wave-wrap" id="waveWrap">
      <canvas id="waveCanvas"></canvas>
      <div class="wave-marks" id="waveMarks"></div>
      <div class="wave-head" id="waveHead"></div>
      <div class="wave-tip" id="waveTip" hidden></div>
    </div>
    <div class="np-times"><b id="npCur">0:00</b><span id="npDur">0:00</span></div>
    <div class="np-controls">
      <button class="icon-btn" id="npShuffle" title="Shuffle"><svg class="ico"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn lg" id="npPrev"><svg class="ico"><use href="#i-prev"/></svg></button>
      <button class="play-btn xl" id="npPlay"><svg class="ico ico-play"><use href="#i-play"/></svg><svg class="ico ico-pause"><use href="#i-pause"/></svg><i class="play-ring"></i></button>
      <button class="icon-btn lg" id="npNext"><svg class="ico"><use href="#i-next"/></svg></button>
      <button class="icon-btn" id="npRepeat" title="Repeat"><svg class="ico"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="np-chips">
      <button class="chip" id="chipEq"><svg class="ico"><use href="#i-eq"/></svg>Equalizer</button>
      <button class="chip" id="chipOrbit"><svg class="ico"><use href="#i-orbit"/></svg>Orbit</button>
      <button class="chip" id="chipKaraoke"><svg class="ico"><use href="#i-mic"/></svg>Vocal</button>
      <button class="chip" id="chipSleep"><svg class="ico"><use href="#i-moon"/></svg>Sleep</button>
      <button class="chip" id="chipCard"><svg class="ico"><use href="#i-card"/></svg>Vibe Card</button>
      <button class="chip" id="chipSpeed"><svg class="ico"><use href="#i-speed"/></svg><b id="speedLabel">1.0×</b></button>
    </div>
  </div>
</div>

<!-- ══════════ overlays ══════════ -->
<div id="themeDock" hidden></div>
<div id="modalRoot" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="ctxMenu" hidden></div>
<div id="dropZone" hidden><div class="drop-card"><svg class="ico"><use href="#i-plus"/></svg><b>Drop audio here</b><small>mp3 · flac · wav · ogg · m4a — stays on your device</small></div></div>
<input id="filePicker" type="file" accept="audio/*,.mp3,.flac,.wav,.ogg,.m4a,.opus,.lrc" multiple hidden>
