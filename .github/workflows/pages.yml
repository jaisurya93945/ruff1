# ═══════════════════════════════════════════════════════════════
#  Keeps audio/manifest.json in step with whatever is in audio/.
#
#  Why this does NOT deploy
#  ────────────────────────
#  This repository's Pages source is a branch, so GitHub already
#  runs its own "pages build and deployment" on every push to
#  main. An actions/deploy-pages step here would be a *second*
#  deployer competing for the same lock — which is exactly what
#  failed on the AURA merge commit:
#
#    HttpError: Deployment request failed ... due to in progress
#    deployment. Please cancel first or wait for it to complete.
#
#  So this workflow only regenerates the manifest and commits it
#  back; GitHub's own pipeline then publishes the result. That
#  means you can drag an .mp3 straight into the GitHub web UI and
#  it shows up in the player — tags, cover art and duration
#  included — without running anything locally.
#
#  If you ever switch Settings → Pages → Source to "GitHub
#  Actions", GitHub's built-in pipeline stops running and nothing
#  will publish the site. Uncomment the `deploy` job at the
#  bottom at that point (and only then).
# ═══════════════════════════════════════════════════════════════
name: Sync audio manifest

on:
  push:
    branches: [main]
    paths:
      - 'audio/**'
      - 'tools/build-manifest.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild manifest
        run: node tools/build-manifest.mjs

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain audio/manifest.json images/covers)" ]; then
            echo "Manifest already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/manifest.json images/covers
          git commit -m "chore: rebuild audio manifest"

          if ! git push; then
            echo "::error title=Cannot push the manifest::The workflow could not write to the repository."
            echo ""
            echo "This is almost always one repository setting:"
            echo "  Settings -> Actions -> General -> Workflow permissions"
            echo "  -> select 'Read and write permissions' -> Save"
            echo ""
            echo "Until then, newly uploaded audio will not appear in the player."
            echo "You can also run 'node tools/build-manifest.mjs' locally and commit the result."
            exit 1
          fi
          echo "Manifest updated; Pages will rebuild from the new commit."

